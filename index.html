<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The config contains secrets: forbid any network requests from scripts. -->
  <meta http-equiv="Content-Security-Policy" content="connect-src 'none'; form-action 'none'">
  <title>RouterLens</title>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Applied before first paint to avoid a flash of the wrong theme.
    (function () {
      try {
        const stored = localStorage.getItem('routerlens-theme');
        if (stored === 'dark' || stored === 'light') document.documentElement.dataset.theme = stored;
      } catch (e) { /* localStorage unavailable (e.g. private mode) */ }
    })();
  </script>
</head>
<body>
  <nav class="rail" aria-label="Main navigation">
    <button class="rail-logo" type="button" data-action="open-file" title="Open config file" aria-label="Open config file">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      </svg>
    </button>
    <div id="nav" class="rail-items"></div>
    <button id="theme-toggle" class="rail-theme-toggle" type="button" title="Switch to dark mode" aria-label="Switch to dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/>
      </svg>
    </button>
  </nav>

  <div class="shell">
    <header class="topbar">
      <h1 id="topbar-title" class="topbar-title">RouterLens</h1>
      <div id="topbar-meta" class="topbar-meta"></div>
      <a class="topbar-icon-btn" href="https://github.com/a-denisov-psb/routerlens" target="_blank" rel="noopener noreferrer" title="Open GitHub repository" aria-label="Open GitHub repository">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.58 2 12.2c0 4.5 2.87 8.32 6.84 9.67.5.1.68-.22.68-.5 0-.24-.01-.87-.01-1.71-2.78.62-3.37-1.37-3.37-1.37-.46-1.19-1.11-1.51-1.11-1.51-.91-.63.07-.62.07-.62 1 .07 1.53 1.05 1.53 1.05.89 1.55 2.34 1.1 2.91.84.09-.66.35-1.1.63-1.36-2.22-.26-4.56-1.14-4.56-5.05 0-1.12.39-2.03 1.03-2.74-.1-.26-.45-1.3.1-2.71 0 0 .84-.27 2.75 1.05a9.3 9.3 0 0 1 2.5-.34c.85 0 1.7.12 2.5.34 1.91-1.32 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.71 1.03 1.62 1.03 2.74 0 3.92-2.34 4.78-4.57 5.04.36.32.68.95.68 1.92 0 1.39-.01 2.51-.01 2.85 0 .28.18.61.69.5C19.14 20.51 22 16.7 22 12.2 22 6.58 17.52 2 12 2z"/>
        </svg>
      </a>
    </header>
    <main id="main" class="main"></main>
  </div>

  <div class="drop-overlay" aria-hidden="true"><span>Drop config file or report to open</span></div>
  <input id="file-input" type="file" accept=".txt,.cfg,.conf,.pdf,text/plain,application/pdf" hidden>

  <script src="js/parser.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/securepoint/pdf-extract.js"></script>
  <script src="js/securepoint/parser.js"></script>
  <script src="js/app.js"></script>
  <script src="js/securepoint/ui.js"></script>
  <!-- Views: each script registers one navigation entry, in this order. -->
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/firewall.js"></script>
  <script src="js/views/routing.js"></script>
  <script src="js/views/securepoint-dashboard.js"></script>
  <script src="js/views/securepoint-users.js"></script>
  <script src="js/views/securepoint-firewall.js"></script>
  <script>RouterLens.start();</script>
</body>
</html>
